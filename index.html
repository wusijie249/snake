<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 贪吃蛇</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

:root {
–neon-green: #00ff88;
–neon-red: #ff3355;
–neon-blue: #00cfff;
–bg: #050810;
–grid: #0d1a2a;
}

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-family: ‘Orbitron’, monospace;
overflow: hidden;
user-select: none;
}

/* Scanline overlay */
body::after {
content: ‘’;
position: fixed;
inset: 0;
background: repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,0,0,0.08) 2px,
rgba(0,0,0,0.08) 4px
);
pointer-events: none;
z-index: 100;
}

.header {
display: flex;
align-items: center;
gap: 40px;
margin-bottom: 16px;
}

.score-box {
text-align: center;
}

.score-label {
color: rgba(0,255,136,0.5);
font-size: 0.55rem;
letter-spacing: 0.2em;
margin-bottom: 2px;
}

.score-value {
color: var(–neon-green);
font-size: 1.6rem;
font-weight: 900;
text-shadow: 0 0 10px var(–neon-green), 0 0 30px rgba(0,255,136,0.4);
}

.title {
color: var(–neon-blue);
font-size: 1rem;
font-weight: 700;
letter-spacing: 0.3em;
text-shadow: 0 0 10px var(–neon-blue);
}

/* Canvas wrapper */
.canvas-wrap {
position: relative;
border: 1px solid rgba(0,255,136,0.3);
box-shadow:
0 0 20px rgba(0,255,136,0.2),
0 0 60px rgba(0,255,136,0.08),
inset 0 0 30px rgba(0,0,0,0.5);
border-radius: 4px;
}

canvas {
display: block;
border-radius: 3px;
}

/* Overlay screens */
.overlay {
position: absolute;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: rgba(5,8,16,0.88);
border-radius: 3px;
gap: 16px;
}

.overlay.hidden { display: none; }

.overlay-title {
font-size: 1.4rem;
font-weight: 900;
letter-spacing: 0.2em;
}

.overlay-title.green { color: var(–neon-green); text-shadow: 0 0 20px var(–neon-green); }
.overlay-title.red   { color: var(–neon-red);   text-shadow: 0 0 20px var(–neon-red); }

.overlay-score {
color: rgba(255,255,255,0.6);
font-size: 0.7rem;
letter-spacing: 0.15em;
}

.btn {
background: transparent;
border: 1px solid var(–neon-green);
color: var(–neon-green);
font-family: ‘Orbitron’, monospace;
font-size: 0.75rem;
letter-spacing: 0.2em;
padding: 10px 28px;
cursor: pointer;
border-radius: 2px;
transition: all 0.2s;
text-shadow: 0 0 8px var(–neon-green);
box-shadow: 0 0 10px rgba(0,255,136,0.2);
}

.btn:hover, .btn:active {
background: rgba(0,255,136,0.15);
box-shadow: 0 0 20px rgba(0,255,136,0.4);
}

/* Mobile D-pad */
.dpad {
margin-top: 20px;
display: grid;
grid-template-columns: repeat(3, 52px);
grid-template-rows: repeat(3, 52px);
gap: 6px;
}

.dpad-btn {
background: rgba(0,255,136,0.06);
border: 1px solid rgba(0,255,136,0.25);
border-radius: 6px;
color: var(–neon-green);
font-size: 1.2rem;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: background 0.1s;
-webkit-tap-highlight-color: transparent;
}

.dpad-btn:active {
background: rgba(0,255,136,0.2);
box-shadow: 0 0 12px rgba(0,255,136,0.4);
}

.dpad-btn.empty { border: none; background: none; pointer-events: none; }
</style>

</head>
<body>

<div class="header">
  <div class="score-box">
    <div class="score-label">SCORE</div>
    <div class="score-value" id="score">0</div>
  </div>
  <div class="title">SNAKE</div>
  <div class="score-box">
    <div class="score-label">BEST</div>
    <div class="score-value" id="best">0</div>
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="c"></canvas>

  <!-- Start screen -->

  <div class="overlay" id="startScreen">
    <div class="overlay-title green">SNAKE</div>
    <div class="overlay-score">用方向键或下方按钮控制</div>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <!-- Game over screen -->

  <div class="overlay hidden" id="gameOverScreen">
    <div class="overlay-title red">GAME OVER</div>
    <div class="overlay-score" id="finalScore"></div>
    <button class="btn" id="restartBtn">再来一局</button>
  </div>
</div>

<!-- D-pad for mobile -->

<div class="dpad">
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnUp">▲</div>
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnLeft">◀</div>
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnRight">▶</div>
  <div class="dpad-btn empty"></div>
  <div class="dpad-btn" id="btnDown">▼</div>
  <div class="dpad-btn empty"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Responsive size
const SIZE = Math.min(window.innerWidth - 40, 340);
const COLS = 20, ROWS = 20;
const CELL = Math.floor(SIZE / COLS);
canvas.width  = CELL * COLS;
canvas.height = CELL * ROWS;

let snake, dir, nextDir, food, score, best = 0, gameLoop, running = false;

function init() {
  snake = [
    {x:10, y:10}, {x:9, y:10}, {x:8, y:10}
  ];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  document.getElementById('score').textContent = 0;
  placeFood();
}

function placeFood() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function step() {
  dir = {...nextDir};
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return endGame();
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return endGame();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      document.getElementById('best').textContent = best;
    }
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  // Background
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = 'rgba(0,255,136,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(canvas.width, y * CELL);
    ctx.stroke();
  }

  // Food — glowing red dot
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  const r = CELL * 0.38;
  const gf = ctx.createRadialGradient(fx, fy, 0, fx, fy, r * 2);
  gf.addColorStop(0, '#ff3355');
  gf.addColorStop(0.5, '#ff0033');
  gf.addColorStop(1, 'transparent');
  ctx.fillStyle = gf;
  ctx.beginPath();
  ctx.arc(fx, fy, r * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff3355';
  ctx.beginPath();
  ctx.arc(fx, fy, r, 0, Math.PI * 2);
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const x = seg.x * CELL + 1;
    const y = seg.y * CELL + 1;
    const w = CELL - 2;

    const alpha = i === 0 ? 1 : Math.max(0.35, 1 - i * 0.03);
    const g = ctx.createLinearGradient(x, y, x + w, y + w);
    if (i === 0) {
      g.addColorStop(0, '#00ffaa');
      g.addColorStop(1, '#00cc66');
    } else {
      g.addColorStop(0, `rgba(0,220,100,${alpha})`);
      g.addColorStop(1, `rgba(0,160,70,${alpha})`);
    }

    ctx.fillStyle = g;
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = i === 0 ? 12 : 4;
    ctx.beginPath();
    ctx.roundRect(x, y, w, w, 3);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Eyes on head
    if (i === 0) {
      ctx.fillStyle = '#050810';
      const ex = dir.x === 0 ? [0.28, 0.72] : [0.6, 0.6];
      const ey = dir.y === 0 ? [0.28, 0.72] : [0.6, 0.6];
      const ex2 = dir.x !== 0 ? (dir.x > 0 ? [0.7, 0.7] : [0.3, 0.3]) : ex;
      const ey2 = dir.y !== 0 ? (dir.y > 0 ? [0.7, 0.7] : [0.3, 0.3]) : ey;
      [[ex2[0], ey[0]], [ex2[1], ey[1]]].forEach(([ex, ey]) => {
        ctx.beginPath();
        ctx.arc(seg.x * CELL + CELL * ex, seg.y * CELL + CELL * ey, 2, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  });
}

function endGame() {
  clearInterval(gameLoop);
  running = false;
  document.getElementById('finalScore').textContent = `得分：${score}`;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  init();
  draw();
  running = true;
  const speed = Math.max(80, 150 - score * 2);
  clearInterval(gameLoop);
  gameLoop = setInterval(() => {
    step();
    // Speed up as score increases
    if (score > 0 && score % 5 === 0) {
      clearInterval(gameLoop);
      gameLoop = setInterval(step, Math.max(80, 150 - score * 2));
    }
  }, 150);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (!running) return;
  const map = {
    ArrowUp:    {x:0,  y:-1},
    ArrowDown:  {x:0,  y:1},
    ArrowLeft:  {x:-1, y:0},
    ArrowRight: {x:1,  y:0},
  };
  const d = map[e.key];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) {
    nextDir = d;
    e.preventDefault();
  }
});

// D-pad buttons
function setDir(d) {
  if (!running) return;
  if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
}
document.getElementById('btnUp').addEventListener('touchstart',    e => { e.preventDefault(); setDir({x:0,y:-1}); });
document.getElementById('btnDown').addEventListener('touchstart',  e => { e.preventDefault(); setDir({x:0,y:1}); });
document.getElementById('btnLeft').addEventListener('touchstart',  e => { e.preventDefault(); setDir({x:-1,y:0}); });
document.getElementById('btnRight').addEventListener('touchstart', e => { e.preventDefault(); setDir({x:1,y:0}); });
document.getElementById('btnUp').addEventListener('click',    () => setDir({x:0,y:-1}));
document.getElementById('btnDown').addEventListener('click',  () => setDir({x:0,y:1}));
document.getElementById('btnLeft').addEventListener('click',  () => setDir({x:-1,y:0}));
document.getElementById('btnRight').addEventListener('click', () => setDir({x:1,y:0}));

// Swipe support
let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? {x:1,y:0} : {x:-1,y:0});
  else setDir(dy > 0 ? {x:0,y:1} : {x:0,y:-1});
}, {passive:true});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// Initial draw
ctx.fillStyle = '#050810';
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>

</body>
</html>
